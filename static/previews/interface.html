<!doctype html>
<html lang="fr">
	<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Pixel’s War · UI preview</title>
	<style>
		* {
			box-sizing: border-box;
		}
		body {
			margin: 0;
			background: #111a17;
			color: #f5f1df;
			font:
				15px/1.45 system-ui,
				sans-serif;
		}
		button {
			font: inherit;
			cursor: pointer;
			color: inherit;
		}
		main {
			max-width: 1480px;
			margin: auto;
			padding: 20px 28px;
		}
		.preview-note {
			font-size: 12px;
			color: #9caa9b;
			display: flex;
			justify-content: space-between;
			margin: 0 0 18px;
			letter-spacing: 0.04em;
		}
		.topbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 24px;
			padding: 16px 20px;
			background: #202e25;
			border: 1px solid #405141;
			border-radius: 12px;
			box-shadow: 0 4px 0 #080f0b;
		}
		.turn {
			display: flex;
			align-items: center;
			gap: 14px;
		}
		.portrait {
			width: 44px;
			height: 44px;
			background: #392929;
			border: 1px solid #97635d;
			border-radius: 8px;
			display: grid;
			place-items: center;
		}
		.portrait img {
			width: 36px;
			height: 36px;
			image-rendering: pixelated;
		}
		.eyebrow {
			font-size: 11px;
			letter-spacing: 0.12em;
			text-transform: uppercase;
			color: #adbaaa;
		}
		.turn strong {
			font-size: 22px;
			line-height: 1.2;
		}
		.active-label {
			display: flex;
			align-items: center;
			gap: 6px;
			font-size: 12px;
			color: #eaaa9f;
			margin-top: 3px;
		}
		.dot {
			width: 6px;
			height: 6px;
			border-radius: 50%;
			background: #ef8e7c;
		}
		.players {
			display: flex;
			align-items: center;
			gap: 10px;
		}
		.player {
			min-width: 140px;
			padding: 8px 14px;
			background: #172219;
			border: 1px solid #3a4c3c;
			border-radius: 8px;
			display: grid;
			grid-template-columns: 1fr auto;
			gap: 4px 18px;
		}
		.player.blue {
			color: #96ccef;
		}
		.player.red {
			color: #f1a295;
			border-color: #a56659;
			background: #302723;
		}
		.player span {
			font-size: 12px;
		}
		.player strong {
			color: #f5efdb;
			font-size: 19px;
			grid-column: 1 / 3;
		}
		.player small {
			font-size: 10px;
			color: #cda995;
		}
		.settings {
			width: 42px;
			height: 42px;
			border: 1px solid #50604c;
			background: #2c3c2b;
			border-radius: 8px;
			font-size: 24px;
			margin-left: 6px;
		}
		.battlefield {
			padding: 28px 0 16px;
		}
		.map {
			position: relative;
			width: min(100%, 1080px);
			aspect-ratio: 3/2;
			overflow: hidden;
			margin: auto;
			background: #1b291e;
			box-shadow: 0 14px 36px #0004;
		}
		.map img {
			position: absolute;
			width: 107.685185%;
			max-width: none;
			left: -3.611111%;
			top: -27.222222%;
			image-rendering: pixelated;
		}
		.zoom-row {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 18px;
			margin-top: 18px;
		}
		.zoom {
			display: flex;
			align-items: center;
			gap: 4px;
			padding: 4px;
			background: #202e25;
			border: 1px solid #405141;
			border-radius: 9px;
		}
		.zoom button {
			width: 36px;
			height: 34px;
			background: transparent;
			border: 0;
			border-radius: 4px;
			font-size: 23px;
		}
		.zoom button:hover {
			background: #3b4a34;
		}
		.zoom img {
			width: 24px;
			height: 24px;
			image-rendering: pixelated;
		}
		.zoom-label {
			font-size: 12px;
			color: #8f9e8c;
		}
		.bottom {
			display: flex;
			align-items: center;
			gap: 20px;
			background: #202e25;
			border: 1px solid #405141;
			border-top: 2px solid #bd7667;
			border-radius: 12px;
			padding: 16px 18px;
			margin-top: 4px;
			box-shadow: 0 4px 0 #080f0b;
		}
		.tile {
			width: 64px;
			height: 64px;
			background: url('/assets/cells/cell-water.png') center/cover;
			image-rendering: pixelated;
			border-radius: 6px;
			flex: none;
		}
		.inspect {
			display: flex;
			align-items: center;
			gap: 13px;
			min-width: 180px;
		}
		.inspect strong {
			display: block;
			font-size: 18px;
		}
		.inspect small {
			display: block;
			color: #aab7a5;
			font-size: 12px;
			margin-top: 3px;
		}
		.stats {
			display: flex;
			gap: 10px;
			font-size: 12px;
			color: #e4e4ce;
			margin-top: 8px;
		}
		.stats span {
			background: #162219;
			padding: 3px 7px;
			border-radius: 4px;
		}
		.spacer {
			flex: 1;
		}
		.actions {
			display: flex;
			gap: 8px;
			align-items: center;
		}
		.action {
			height: 44px;
			min-width: 44px;
			border: 1px solid #56644e;
			border-bottom: 3px solid #101a12;
			border-radius: 7px;
			background: #33432f;
			padding: 0 12px;
		}
		.action:hover {
			background: #405339;
		}
		.cargo {
			font-size: 13px;
			color: #d1dac9;
			display: flex;
			align-items: center;
			gap: 7px;
		}
		.action.muted {
			opacity: 0.45;
		}
		.end {
			height: 48px;
			background: #efd47e;
			color: #292817;
			border: 1px solid #fbe5a0;
			border-bottom: 4px solid #ad863e;
			border-radius: 8px;
			padding: 0 22px;
			font-weight: 750;
			margin-left: 7px;
			white-space: nowrap;
		}
		.end:hover {
			background: #ffe59a;
		}
		.minimap {
			width: 100px;
			aspect-ratio: 3/2;
			overflow: hidden;
			position: relative;
			border: 2px solid #68765c;
			border-radius: 5px;
			margin-left: 4px;
		}
		.minimap img {
			position: absolute;
			width: 107.685185%;
			left: -3.611111%;
			top: -27.222222%;
			image-rendering: pixelated;
		}
		.keyhint {
			font-size: 11px;
			color: #84927d;
			text-align: right;
			margin: 12px 2px;
		}
		button:focus-visible {
			outline: 2px solid #efd47e;
			outline-offset: 3px;
		}
		@media (max-width: 850px) {
			main {
				padding: 16px;
			}
			.topbar {
				gap: 12px;
				padding: 12px;
			}
			.player {
				min-width: 100px;
			}
			.bottom {
				flex-wrap: wrap;
				gap: 14px;
			}
			.spacer {
				display: none;
			}
			.actions {
				margin-left: auto;
			}
			.minimap {
				display: none;
			}
			.zoom-label {
				display: none;
			}
		}
		@media (max-width: 540px) {
			.topbar {
				flex-wrap: wrap;
			}
			.players {
				width: 100%;
			}
			.player {
				flex: 1;
			}
			.turn strong {
				font-size: 20px;
			}
			.battlefield {
				padding-top: 20px;
			}
			.actions {
				width: 100%;
				justify-content: flex-end;
			}
			.end {
				flex: 1;
			}
			.preview-note span:last-child {
				display: none;
			}
			.bottom {
				padding: 12px;
			}
			.inspect {
				min-width: 0;
			}
		}
		.zoom-row {
			justify-content: space-between;
			width: min(100%, 1080px);
			margin: 18px auto 0;
		}
		.zoom-group {
			display: flex;
			align-items: center;
			gap: 12px;
		}
		.zoom-row .minimap {
			display: block;
			width: 100px;
			margin: 0;
		}
		.bottom {
			align-items: center;
		}
		.inspect {
			align-self: flex-start;
		}
		@media (max-width: 540px) {
			.zoom-row .minimap {
				width: 80px;
			}
			.zoom-group {
				gap: 6px;
			}
		}
	</style>
	<main>
		<div class="preview-note"><span>UI EXPLORATION · TOP & BOTTOM</span><span>Original map · preview only</span></div>
		<header class="topbar">
			<div class="turn">
				<div class="portrait"><img src="/assets/units/infantry-2-fit.png" alt="" /></div>
				<div>
					<div class="eyebrow">Long Island Iced Tea</div>
					<strong>Tour 2</strong>
					<div class="active-label"><i class="dot"></i>Au tour du Joueur 2</div>
				</div>
			</div>
			<div class="players">
				<div class="player blue">
					<span>Joueur 1</span><strong>0 <span>$</span></strong>
				</div>
				<div class="player red">
					<span>Joueur 2</span><small>ACTIF</small><strong>0 <span>$</span></strong>
				</div>
				<button class="settings" aria-label="Options">⚙</button>
			</div>
		</header>
		<section class="battlefield">
			<div class="map"><img src="ui-map-source.png" alt="Carte originale, inchangée" /></div>
			<div class="zoom-row">
				<div class="minimap"><img src="ui-map-source.png" alt="Mini-carte" /></div>
				<div class="zoom-group">
					<div class="zoom">
						<button aria-label="Dézoomer">−</button><button aria-label="Zoomer">+</button><button aria-label="Ajuster la carte"><img src="/assets/icons/fit-map.svg" alt="" /></button>
					</div>
					<span class="zoom-label">Vue complète</span>
				</div>
			</div>
		</section>
		<footer class="bottom">
			<div class="inspect">
				<div class="tile"></div>
				<div>
					<div class="eyebrow">Case survolée</div>
					<strong>Eau</strong>
					<div class="stats"><span>Déplacement 2</span><span>Défense 0</span></div>
				</div>
			</div>
			<div class="spacer"></div>
			<div class="actions">
				<button class="action cargo muted" title="Passagers">▣ <b>0/3</b></button><button class="action" title="Annuler" aria-label="Annuler">↶</button><button class="action" title="Confirmer" aria-label="Confirmer">✓</button><button class="end">Fin du tour <span style="margin-left: 14px">→</span></button>
			</div>
		</footer>
		<p class="keyhint">Maquette visuelle · commandes illustratives</p>
	</main>
</html>
