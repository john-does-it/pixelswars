name: Validate SvelteKit
on:
  push:
    branches: [main, codex, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Run browser regression tests
        run: npm run test:e2e -- --grep-invert "stays responsive on large map"
      - name: Measure AI responsiveness without competing browser workers
        run: npm run test:e2e -- tests/e2e/ai-performance.spec.ts --project desktop --workers 1 --output test-results/ai-performance
      - name: Upload failed browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
