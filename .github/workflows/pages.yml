name: Deploy GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check TURN configuration
        env:
          METERED_APP: ${{ vars.METERED_APP }}
          METERED_TURN_API_KEY: ${{ secrets.METERED_TURN_API_KEY }}
        run: |
          if [ -z "$METERED_APP" ] || [ -z "$METERED_TURN_API_KEY" ]; then
            echo "Configure the METERED_APP Actions variable and METERED_TURN_API_KEY Actions secret before deploying."
            exit 1
          fi
      - run: npm run build
        env:
          BASE_PATH: ''
          VITE_METERED_APP: ${{ vars.METERED_APP }}
          VITE_METERED_TURN_API_KEY: ${{ secrets.METERED_TURN_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
